version: "3.9"

services:
  server:
    build:
      context: ./sandbox/server
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./sandbox/server:/app
      - /app/node_modules
    command: npm start

  template:
    build:
      context: ./sandbox/template
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./sandbox/tempelate:/workspace
      - /workspace/node_modules
    command: npm run dev
